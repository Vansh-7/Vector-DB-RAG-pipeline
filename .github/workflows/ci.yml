
name: CI

on:
  push:
    branches:
      - deploy/v1
      - frontend-redesign
      - main

  pull_request:
    branches:
      - deploy/v1
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_CACHE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: false

      - name: Configure temporary vector storage
        run: |
          echo "VECTOR_DATA_DIR=$RUNNER_TEMP/neuebit-ci" >> "$GITHUB_ENV"
          echo "VECTOR_DB_FILE=$RUNNER_TEMP/neuebit-ci/vector_database.pkl" >> "$GITHUB_ENV"
          echo "VECTOR_WAL_FILE=$RUNNER_TEMP/neuebit-ci/vector_database.wal" >> "$GITHUB_ENV"


      - name: Install locked backend dependencies
        run: uv sync --locked --python 3.12

      - name: Run backend tests
        run: uv run --locked --python 3.12 pytest -q

  frontend-build:
    name: Frontend build (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: npm run build
