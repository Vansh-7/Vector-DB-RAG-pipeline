[project]
name = "vector-db-project"
version = "0.1.0"
description = "A custom Vector Database and RAG pipeline built from scratch implementing HNSW, KD-Tree, and Brute Force search algorithms."
requires-python = ">=3.10"

dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.137.2",
    "langchain-text-splitters>=1.1.2",
    "loguru>=0.7.3",
    "nltk>=3.9.4",
    "numpy>=1.26.0",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.0",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=5.6.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "tiktoken>=0.13.0",
    "torch>=2.12.1",
]


[tool.uv]
managed = true
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true 
mypy_path = "src"
explicit_package_bases = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "scipy>=1.15.3",
]
